# Push tag "v1.2" (dst) → GitHub membangun app dan melampirkan NotchLyrics.zip di Releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # SDK macOS 15 dibutuhkan untuk Translation framework
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/NotchLyrics.app NotchLyrics.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: NotchLyrics.zip
          generate_release_notes: true
