# Terbitkan Release baru di GitHub (mis. tag "v1.2") → app dibangun dan popocu.zip
# otomatis dilampirkan ke Release itu.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # SDK macOS 15 dibutuhkan untuk Translation framework
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/popocu.app popocu.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: popocu.zip
